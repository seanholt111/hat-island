<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061820">
<title>Hat Island · 3D Orbit</title>
<style>:root{--bg:#061820;--panel:rgba(6,22,32,.78);--text:#e8f4ff;--muted:#8fb0c8;--accent:#5ec8ff;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}
#c{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));
top:calc(10px + var(--safe-t));display:flex;align-items:flex-start;justify-content:space-between;
gap:10px;pointer-events:none;z-index:5}
.card{pointer-events:auto;background:var(--panel);border:1px solid rgba(94,200,255,.22);
border-radius:14px;padding:10px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:min(72vw,280px)}
.title{font-weight:800;font-size:.95rem;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.72rem;margin-top:3px;line-height:1.35}
#controls{position:absolute;right:calc(12px + var(--safe-r));bottom:calc(52px + var(--safe-b));
display:flex;flex-direction:column;gap:8px;z-index:5}
.btn{width:48px;height:48px;border-radius:14px;border:1px solid rgba(94,200,255,.28);
background:var(--panel);color:var(--text);font-size:1.35rem;font-weight:600;
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;display:grid;place-items:center;line-height:1}
.btn:active{transform:scale(.96);background:rgba(20,48,68,.9)}
#hint{position:absolute;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);
z-index:6;pointer-events:none;background:rgba(4,16,24,.72);border:1px solid rgba(94,200,255,.2);
color:var(--muted);font-size:.78rem;padding:8px 14px;border-radius:999px;white-space:nowrap;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .6s ease}
#hint.fade{opacity:0}
#loader{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:14px;
background:radial-gradient(ellipse at 50% 40%,#0c2a3a 0%,var(--bg) 70%);transition:opacity .45s ease}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:36px;height:36px;border:3px solid rgba(94,200,255,.2);
border-top-color:var(--accent);border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:var(--muted);font-size:.85rem}
#attrib{position:absolute;left:calc(10px + var(--safe-l));bottom:calc(8px + var(--safe-b));
z-index:5;max-width:calc(100% - 80px);font-size:.58rem;line-height:1.35;
color:rgba(180,205,220,.55);pointer-events:none}
</style>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loader"><div class="spinner" aria-hidden="true"></div><p>Loading Hat Island terrain…</p></div>
<div id="hud"><div class="card"><div class="title">Hat Island</div><div class="sub">Gedney Island · Possession Sound, WA<br>B25 hi-res patch · Maps pin · brother-in-law</div></div></div>
<div id="controls">
<button class="btn" id="btnZoomIn" type="button" aria-label="Zoom in">+</button>
<button class="btn" id="btnZoomOut" type="button" aria-label="Zoom out">−</button>
<button class="btn" id="btnB25" type="button" aria-label="Go to B25" title="B25" style="font-size:.72rem;font-weight:800">B25</button>
<button class="btn" id="btnReset" type="button" aria-label="Reset view" title="Reset">⌂</button>
</div>
<div id="hint">Drag to orbit · pinch to zoom</div>
<div id="attrib">Elevation: OpenTopoData · Imagery: Esri World Imagery</div>
<script type="module" src="./app.js"></script>
</body></html>
